<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Quantitativo de Opções</title>
    <!-- Biblioteca de Gráficos Plotly -->
    <script src="https://plot.ly"></script>
    <style>
        body { background-color: #0d0e12; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .painel-controles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; background: #161a23; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #242b3d; }
        .controle { display: flex; flex-direction: column; }
        label { font-size: 11px; color: #8a99ad; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        input, select { background: #0d0e12; border: 1px solid #343e56; color: #fff; padding: 10px; border-radius: 4px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #ffb703; }
        #grafico { background: #161a23; border-radius: 8px; padding: 10px; border: 1px solid #242b3d; min-height: 650px; }
        .ticker-preco { background: #1c2333; color: #06d6a0; font-weight: bold; padding: 10px; border-radius: 4px; text-align: center; border: 1px solid #343e56; align-self: end; font-size: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Simulador Quantitativo de Opções (LIVE)</h2>
    <div class="painel-controles">
        <div class="controle">
            <label for="ativo">Ativo Alvo</label>
            <select id="ativo">
                <option value="xauusd">Ouro (XAU/USD - Live)</option>
                <option value="win">Mini Índice (WIN - B3)</option>
                <option value="acoes">Ações Padrão (Ex: PETR4)</option>
            </select>
        </div>
        <div class="controle">
            <label for="tipoOpcao">Tipo de Opção</label>
            <select id="tipoOpcao">
                <option value="call">Call</option>
                <option value="put">Put</option>
            </select>
        </div>
        <div class="controle"><label for="strike">Preço de Exercício (K)</label><input type="number" id="strike" value="4400"></div>
        <div class="controle"><label for="dias">Dias para Vencimento (T)</label><input type="number" id="dias" value="90"></div>
        <div class="controle"><label for="juros">Taxa de Juros (r %)</label><input type="number" id="juros" value="4.15" step="0.01"></div>
        <div class="controle"><label for="vol">Volatilidade Implícita (σ %)</label><input type="number" id="vol" value="14" step="0.1"></div>
        <div class="ticker-preco" id="live-price-ticker">Carregando...</div>
    </div>
    <div id="grafico"></div>
</div>
<script>
let precoAtualMercado = 4420;

function cdfNormal(x) {
    const b1 = 0.319381530, b2 = -0.356563782, b3 = 1.781477937, b4 = -1.821255978, b5 = 1.330274429;
    const p = 0.2316419, c = 0.39894228;
    if (x >= 0) { let t = 1.0 / (1.0 + p * x); return (1.0 - c * Math.exp(-x * x / 2.0) * t * (t * (t * (t * (t * b5 + b4) + b3) + b2) + b1)); } 
    else { let t = 1.0 / (1.0 - p * x); return (c * Math.exp(-x * x / 2.0) * t * (t * (t * (t * (t * b5 + b4) + b3) + b2) + b1)); }
}
function pdfNormal(x) { return Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI); }

function calcularGregas(S, K, T_dias, r_pct, sigma_pct, tipo) {
    const T = T_dias / 365.0; const r = r_pct / 100.0; const sigma = sigma_pct / 100.0;
    if (K <= 0 || T <= 0 || sigma <= 0) return { preco: tipo === 'put' ? Math.max(0, K - S) : Math.max(0, S - K), gamma: 0, zomma: 0 };
    const d1 = (Math.log(S / K) + (r + 0.5 * sigma * sigma) * T) / (sigma * Math.sqrt(T));
    const d2 = d1 - sigma * Math.sqrt(T);
    const gamma = pdfNormal(d1) / (S * sigma * Math.sqrt(T));
    return { 
        preco: tipo === 'put' ? (K * Math.exp(-r * T) * cdfNormal(-d2) - S * cdfNormal(-d1)) : (S * cdfNormal(d1) - K * Math.exp(-r * T) * cdfNormal(d2)), 
        gamma: gamma, 
        zomma: gamma * ((d1 * d2 - 1) / sigma) 
    };
}

const configuracaoAtivos = {
    acoes:   { minX: 20,     maxX: 40,      passo: 0.2,   legenda: "Preço em R$" },
    win:     { minX: 115000, maxX: 135000,  passo: 200,   legenda: "Pontos do Mini Índice" },
    xauusd:  { minX: 4200,   maxX: 4600,    passo: 4,     legenda: "Preço do Ouro (USD)" }
};

function renderizarGrafico() {
    const ativoSelecionado = document.getElementById('ativo').value;
    const tipoOpcao = document.getElementById('tipoOpcao').value;
    const config = configuracaoAtivos[ativoSelecionado];
    const K = parseFloat(document.getElementById('strike').value) || 10;
    const dias = parseFloat(document.getElementById('dias').value) || 10;
    const juros = parseFloat(document.getElementById('juros').value) || 0;
    const vol = parseFloat(document.getElementById('vol').value) || 10;

    const listaS = [], listaPreco = [], listaGamma = [], listaZomma = [];
    for (let S = config.minX; S <= config.maxX; S += config.passo) {
        const valores = calcularGregas(S, K, dias, juros, vol, tipoOpcao);
        listaS.push(S); listaPreco.push(valores.preco); listaGamma.push(valores.gamma); listaZomma.push(valores.zomma);
    }

    const traces = [
        { x: listaS, y: listaPreco, name: 'Prêmio da Opção', type: 'scatter', line: { color: '#ffb703', width: 2.5 }, xaxis: 'x', yaxis: 'y' },
        { x: listaS, y: listaGamma, name: 'Gamma', type: 'scatter', line: { color: '#06d6a0', width: 2 }, xaxis: 'x', yaxis: 'y2' },
        { x: listaS, y: listaZomma, name: 'Zomma', type: 'scatter', line: { color: '#ef476f', width: 2, dash: 'dot' }, xaxis: 'x', yaxis: 'y3' },
        { x: [K, K], y: [0, Math.max(...listaPreco, 1)], name: 'Strike (K)', type: 'scatter', mode: 'lines', line: { color: '#ffffff', width: 1, dash: 'dash' }, xaxis: 'x', yaxis: 'y', showlegend: false },
        { x: [K, K], y: [Math.min(...listaZomma, 0), Math.max(...listaGamma, 0.001)], type: 'scatter', mode: 'lines', line: { color: '#ffffff', width: 1, dash: 'dash' }, xaxis: 'x', yaxis: 'y2', showlegend: false },
        { x: [precoAtualMercado, precoAtualMercado], y: [0, Math.max(...listaPreco, 1)], name: 'Preço Spot', type: 'scatter', mode: 'lines', line: { color: '#ef233c', width: 2 }, xaxis: 'x', yaxis: 'y' },
        { x: [precoAtualMercado, precoAtualMercado], y: [Math.min(...listaZomma, 0), Math.max(...listaGamma, 0.001)], type: 'scatter', mode: 'lines', line: { color: '#ef233c', width: 2 }, xaxis: 'x', yaxis: 'y2', showlegend: false }
    ];

    const layout = {
        height: 650, paper_bgcolor: '#161a23', plot_bgcolor: '#161a23', font: { color: '#8a99ad' }, showlegend: true, legend: { orientation: 'h', x: 0, y: 1.08 },
        xaxis: { title: config.legenda, gridcolor: '#242b3d', anchor: 'y2' },
        yaxis: { title: 'Preço do Prêmio', gridcolor: '#242b3d', domain: [0.55, 1.0] },
        yaxis2: { title: 'Gamma', gridcolor: '#242b3d', domain: [0.0, 0.45] },
        yaxis3: { title: 'Zomma', overlaying: 'y2', side: 'right', showgrid: false }
    };
    Plotly.newPlot('grafico', traces, layout);
}

async function atualizarPrecoAoVivo() {
    const ativo = document.getElementById('ativo').value;
    const ticker = document.getElementById('live-price-ticker');
    
    if (ativo === 'xauusd') {
        try {
            const resposta = await fetch('https://cryptocompare.com');
            const dados = await resposta.json();
            if (dados && dados.USD) {
                precoAtualMercado = parseFloat(dados.USD);
                ticker.innerText = `LIVE: $ ${precoAtualMercado.toFixed(2)}`;
                ticker.style.color = '#06d6a0';
            }
        } catch (e) {
            ticker.innerText = "Sincronizando...";
        }
    } else if (ativo === 'win') {
        precoAtualMercado = 125000 + (Math.random() * 200 - 100);
        ticker.innerText = `WIN: ${Math.round(precoAtualMercado)} pts`;
    } else {
        precoAtualMercado = 31.00;
        ticker.innerText = "Simulado";
    }
    renderizarGrafico();
}

document.getElementById('ativo').addEventListener('change', function() {
    if (this.value === 'win') { document.getElementById('strike').value = 125000; document.getElementById('vol').value = 22; }
    else if (this.value === 'xauusd') { document.getElementById('strike').value = 4400; document.getElementById('vol').value = 14; }
    else { document.getElementById('strike').value = 30; document.getElementById('vol').value = 8.7; }
    atualizarPrecoAoVivo();
});

document.getElementById('tipoOpcao').addEventListener('change', renderizarGrafico);
document.querySelectorAll('input').forEach(input => input.addEventListener('input', renderizarGrafico));

renderizarGrafico();
setInterval(atualizarPrecoAoVivo, 5000);
atualizarPrecoAoVivo();
</script>
</body>
</html>
